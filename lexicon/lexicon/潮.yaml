id: 潮
palabras:
  - palabra: 潮
    lectura: しお
    tipo_lectura: kun
    significado: Marea
    mascara: '--'
    frase: だんだん(潮)が満ちてきました。
    traduccion: Poco a poco ha subido la marea.
  - palabra: 潮時
    lectura: しおどき
    tipo_lectura: kun
    significado: Momento oportuno
    mascara: '--.--'
    frase: 今は話す(潮)時ではありません。
    traduccion: Ahora no es el momento oportuno para hablarlo.
  - palabra: 黒潮
    lectura: くろしお
    tipo_lectura: kun
    significado: Corriente Kuroshio
    mascara: '--.--'
    frase: 黒(潮)は日本沿岸を流れます。
    traduccion: La corriente Kuroshio discurre por la costa de Japón.
  - palabra: 潮汐
    lectura: ちょうせき
    tipo_lectura: 'on'
    significado: Marea
    mascara: '---.--'
    frase: この海岸では(潮)汐の変化が大きいです。
    traduccion: En esta costa los cambios de marea son grandes.
  - palabra: 潮汐表
    lectura: ちょうせきひょう
    tipo_lectura: 'on'
    significado: Tabla de mareas
    mascara: '---.--.---'
    frase: 船長が(潮)汐表を見て出発しました。
    traduccion: El capitán zarpó mirando la tabla de mareas.
