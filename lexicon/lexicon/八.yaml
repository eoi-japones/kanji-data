id: 八
palabras:
  - palabra: お八つ
    lectura: おやつ
    tipo_lectura: kun
    significado: Merienda, alimento de media tarde
    mascara: '-.-.-'
    frase: お(八)つにパンとお茶を食べました。
    traduccion: Comí pan y tomé té de merienda.
  - palabra: 八つ
    lectura: やっつ
    tipo_lectura: kun
    significado: Ocho; ocho años
    mascara: '--.-'
    frase: (八)つ葉のクローバーを見つけました。
    traduccion: Encontré un trébol de ocho hojas.
  - palabra: 八分音符
    lectura: はちぶおんぷ
    tipo_lectura: 'on'
    significado: Corchea
    mascara: '--.-.--.-'
    frase: (八)分音符を二つつなげます。
    traduccion: Uno dos corcheas.
  - palabra: 十八
    lectura: じゅうはち
    tipo_lectura: 'on'
    significado: Dieciocho
    mascara: '---.--'
    frase: 妹は十(八)歳で、大学生です。
    traduccion: Mi hermana menor tiene dieciocho años y va a la universidad.
