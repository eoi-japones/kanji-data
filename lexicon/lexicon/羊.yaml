id: 羊
palabras:
  - palabra: 子羊
    lectura: こひつじ
    tipo_lectura: kun
    significado: Cordero
    mascara: '-.---'
    frase: 子(羊)が草を食べています。
    traduccion: Un cordero está comiendo hierba.
  - palabra: 羊
    lectura: ひつじ
    tipo_lectura: kun
    significado: Oveja
    mascara: '---'
    frase: 牧場に(羊)がたくさんいます。
    traduccion: En la granja hay muchas ovejas.
  - palabra: 羊痘
    lectura: ひつじとう
    tipo_lectura: kun
    significado: Ectima contagioso
    mascara: '---.--'
    frase: (羊)痘は羊の病気です。
    traduccion: El ectima contagioso es una enfermedad de las ovejas.
