id: 眠
palabras:
  - palabra: 不眠症
    lectura: ふみんしょう
    tipo_lectura: 'on'
    significado: Insomnio
    mascara: '-.--.---'
    frase: 不(眠)症で困っています。
    traduccion: Sufro insomnio.
  - palabra: 冬眠
    lectura: とうみん
    tipo_lectura: 'on'
    significado: Hibernación
    mascara: '--.--'
    frase: クマは冬に冬(眠)します。
    traduccion: Los osos hibernan en invierno.
  - palabra: 眠い
    lectura: ねむい
    tipo_lectura: kun
    significado: Con sueño
    mascara: '--.-'
    frase: 朝はとても(眠)いです。
    traduccion: Por la mañana tengo mucho sueño.
  - palabra: 眠たい
    lectura: ねむたい
    tipo_lectura: kun
    significado: Soñoliento
    mascara: '--.-.-'
    frase: まだ少し(眠)たいです。
    traduccion: Todavía tengo un poco de sueño.
  - palabra: 眠り
    lectura: ねむり
    tipo_lectura: kun
    significado: Sueño, dormida
    mascara: '--.-'
    frase: 彼は深い(眠)りに落ちました。
    traduccion: Él cayó en un sueño profundo.
