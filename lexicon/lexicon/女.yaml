id: 女
palabras:
  - palabra: 女
    lectura: おんな
    tipo_lectura: kun
    significado: Mujer
    mascara: '---'
    frase: 写真の(女)は私の母です。
    traduccion: La mujer de la foto es mi madre.
  - palabra: 女の子
    lectura: おんなのこ
    tipo_lectura: kun
    significado: Niña, hija
    mascara: '---.-.-'
    frase: 公園で(女)の子と遊びました。
    traduccion: Jugué con una niña en el parque.
  - palabra: 女子
    lectura: じょし
    tipo_lectura: 'on'
    significado: Mujer, chica
    mascara: '--.-'
    frase: このクラスには(女)子が十人います。
    traduccion: En esta clase hay diez chicas.
  - palabra: 女神
    lectura: めがみ
    tipo_lectura: kun
    significado: Diosa
    mascara: '-.--'
    frase: その神話には(女)神が登場します。
    traduccion: En ese mito aparece una diosa.
  - palabra: 皇女
    lectura: こうじょ
    tipo_lectura: 'on'
    significado: Princesa imperial
    mascara: '--.--'
    frase: 皇(女)が式典に出ました。
    traduccion: La princesa imperial asistió a la ceremonia.
  - palabra: 乙女心
    lectura: おとめごころ
    tipo_lectura: kun
    significado: Corazón de una joven
    mascara: '--.-.---'
    frase: 乙(女)心は複雑です。
    traduccion: El corazón de una joven es complejo.
