id: 止
palabras:
  - palabra: 中止
    lectura: ちゅうし
    tipo_lectura: 'on'
    significado: Suspensión, cancelación
    mascara: '---.-'
    frase: 雨で試合が中(止)になりました。
    traduccion: El partido se suspendió por la lluvia.
  - palabra: 止まる
    lectura: とどまる
    tipo_lectura: kun
    significado: Detenerse, pararse
    mascara: '--.-.-'
    frase: バスは駅前に三十分(止)どまります。
    traduccion: El autobús se queda treinta minutos delante de la estación.
  - palabra: 止める
    lectura: とめる
    tipo_lectura: kun
    significado: Parar, detener
    mascara: '-.-.-'
    frase: ここで車を(止)めてください。
    traduccion: Pare el coche aquí.
  - palabra: 下痢止め
    lectura: げりどめ
    tipo_lectura: kun
    significado: Medicamento contra la diarrea
    mascara: '-.-.-.-'
    frase: 下痢(止)めを飲みました。
    traduccion: Tomé un medicamento contra la diarrea.
  - palabra: 休止符
    lectura: きゅうしふ
    tipo_lectura: 'on'
    significado: Signo de silencio
    mascara: '---.-.-'
    frase: 楽譜に休(止)符があります。
    traduccion: En la partitura hay un signo de silencio.
  - palabra: 止痒薬
    lectura: しようやく
    tipo_lectura: 'on'
    significado: Medicamento contra el picor
    mascara: '-.--.--'
    frase: (止)痒薬を塗りました。
    traduccion: Me puse un medicamento contra el picor.
