id: 畑
palabras:
  - palabra: 田畑
    lectura: たはた
    tipo_lectura: kun
    significado: Campos de arroz y secano
    mascara: '-.--'
    frase: 車窓から田(畑)が見えました。
    traduccion: Desde la ventanilla del tren se veían los campos.
  - palabra: 畑
    lectura: はたけ
    tipo_lectura: kun
    significado: Huerta, campo
    mascara: '---'
    frase: 祖母の家に野菜の(畑)があります。
    traduccion: En casa de mi abuela hay una huerta.
  - palabra: 茶畑
    lectura: ちゃばたけ
    tipo_lectura: kun
    significado: Campo de té
    mascara: '--.---'
    frase: 静岡には広い茶(畑)があります。
    traduccion: En Shizuoka hay extensos campos de té.
