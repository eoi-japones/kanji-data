id: 橋
palabras:
  - palabra: 橋
    lectura: はし
    tipo_lectura: kun
    significado: Puente
    mascara: '--'
    frase: 川に(橋)を渡ります。
    traduccion: Cruzo el río por el puente.
  - palabra: 石橋
    lectura: いしばし
    tipo_lectura: kun
    significado: Puente de piedra
    mascara: '--.--'
    frase: 古い石(橋)が川にかかっています。
    traduccion: Un viejo puente de piedra cruza el río.
  - palabra: 鉄橋
    lectura: てっきょう
    tipo_lectura: kun
    significado: Puente de hierro
    mascara: '-----.'
    frase: 電車は鉄(橋)を渡ります。
    traduccion: El tren cruza un puente de hierro.
