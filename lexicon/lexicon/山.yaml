id: 山
palabras:
  - palabra: 山
    lectura: やま
    tipo_lectura: kun
    significado: Montaña
    mascara: '--'
    frase: 週末に(山)へ登りました。
    traduccion: El fin de semana subí a la montaña.
  - palabra: 山寺
    lectura: やまでら
    tipo_lectura: kun
    significado: Templo de montaña
    mascara: '--.--'
    frase: (山)寺の鐘が聞こえます。
    traduccion: Se oye la campana del templo de la montaña.
  - palabra: 山菜
    lectura: さんさい
    tipo_lectura: 'on'
    significado: Verduras silvestres
    mascara: '--.--'
    frase: 山で(山)菜を採りました。
    traduccion: Recolecté verduras silvestres en la montaña.
  - palabra: 山賊
    lectura: さんぞく
    tipo_lectura: 'on'
    significado: Bandido
    mascara: '--.--'
    frase: (山)賊が旅人を襲いました。
    traduccion: Los bandidos atacaron a los viajeros.
  - palabra: 山道
    lectura: やまみち
    tipo_lectura: kun
    significado: Camino de montaña
    mascara: '--.--'
    frase: (山)道は雨の後で歩きにくいです。
    traduccion: El camino de montaña es difícil de andar después de la lluvia.
  - palabra: 氷山
    lectura: ひょうざん
    tipo_lectura: 'on'
    significado: Iceberg
    mascara: '---.--'
    frase: 氷(山)が海を漂っています。
    traduccion: Un iceberg flota por el mar.
  - palabra: 銅山
    lectura: どうざん
    tipo_lectura: 'on'
    significado: Mina de cobre
    mascara: '--.--'
    frase: 町は昔、銅(山)で栄えました。
    traduccion: El pueblo prosperó antaño con la mina de cobre.
  - palabra: 高山
    lectura: こうざん
    tipo_lectura: 'on'
    significado: Montaña alta
    mascara: '--.--'
    frase: 高(山)の空気はとても涼しいです。
    traduccion: El aire de la montaña alta es muy fresco.
