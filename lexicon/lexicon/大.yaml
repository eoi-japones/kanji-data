id: 大
palabras:
  - palabra: 医大
    lectura: いだい
    tipo_lectura: 'on'
    significado: Universidad de medicina
    mascara: '-.--'
    frase: 兄は医(大)に通っています。
    traduccion: Mi hermano mayor estudia en la universidad de medicina.
  - palabra: 大仏
    lectura: だいぶつ
    tipo_lectura: 'on'
    significado: Gran Buda
    mascara: '--.--'
    frase: 奈良には有名な(大)仏があります。
    traduccion: En Nara hay un famoso Gran Buda.
  - palabra: 大佐
    lectura: たいさ
    tipo_lectura: 'on'
    significado: Coronel
    mascara: '--.-'
    frase: 映画に(大)佐が登場します。
    traduccion: En la película aparece un coronel.
  - palabra: 大半
    lectura: たいはん
    tipo_lectura: 'on'
    significado: La mayoría, casi todo
    mascara: '--.--'
    frase: 学生の(大)半が参加しました。
    traduccion: La mayoría de los estudiantes participó.
  - palabra: 大学
    lectura: だいがく
    tipo_lectura: 'on'
    significado: Universidad
    mascara: '--.--'
    frase: (大)学で歴史を勉強します。
    traduccion: Estudio historia en la universidad.
  - palabra: 大文字
    lectura: おおもじ
    tipo_lectura: kun
    significado: Mayúscula
    mascara: '----..'
    frase: 名前は(大)文字で書いてください。
    traduccion: Escriba el nombre con mayúsculas.
  - palabra: 大昔
    lectura: おおむかし
    tipo_lectura: kun
    significado: Tiempos remotos
    mascara: '--.---'
    frase: (大)昔の写真を見ました。
    traduccion: Ví fotos de tiempos remotos.
  - palabra: 大笑い
    lectura: おおわらい
    tipo_lectura: kun
    significado: Carcajada, gran risa
    mascara: '--.--.-'
    frase: 映画を見て(大)笑いしました。
    traduccion: Nos reímos a carcajadas viendo la película.
  - palabra: 大筋
    lectura: おおすじ
    tipo_lectura: kun
    significado: Líneas generales, resumen
    mascara: '--.--'
    frase: (大)筋で合意しました。
    traduccion: Llegamos a un acuerdo en lo esencial.
  - palabra: 大船
    lectura: おおぶね
    tipo_lectura: kun
    significado: Baque grande, buque
    mascara: '--.--'
    frase: (大)船で海を渡りました。
    traduccion: Crucé el mar en un buque grande.
  - palabra: 大金
    lectura: たいきん
    tipo_lectura: 'on'
    significado: Dineral, gran cantidad de dinero
    mascara: '--.--'
    frase: 車を買うのに(大)金を使いました。
    traduccion: Gasté un dineral en comprar el coche.
  - palabra: 大雨
    lectura: おおあめ
    tipo_lectura: kun
    significado: Lluvia torrencial, aguacero
    mascara: '--.--'
    frase: (大)雨で電車が止まりました。
    traduccion: Por la lluvia torrencial se pararon los trenes.
  - palabra: 寛大
    lectura: かんだい
    tipo_lectura: 'on'
    significado: Tolerante, generoso, indulgente
    mascara: '--.--'
    frase: 先生はとても寛(大)な人です。
    traduccion: El profesor es una persona muy tolerante.
  - palabra: 大箱
    lectura: おおばこ
    tipo_lectura: kun
    significado: Caja grande
    mascara: '--.--'
    frase: (大)箱を二つ運びました。
    traduccion: Transporté dos cajas grandes.
