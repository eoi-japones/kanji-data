id: 次
palabras:
  - palabra: 次
    lectura: つぎ
    tipo_lectura: kun
    significado: Siguiente
    mascara: '--'
    frase: (次)の駅で降ります。
    traduccion: Bajo en la siguiente estación.
  - palabra: 次々
