id: 学
palabras:
  - palabra: 医学
    lectura: いがく
    tipo_lectura: 'on'
    significado: Medicina, ciencia médica
    mascara: '-.--'
    frase: 大学で医(学)を勉強しています。
    traduccion: Estudio medicina en la universidad.
  - palabra: 医学部
    lectura: いがくぶ
    tipo_lectura: 'on'
    significado: Facultad de medicina
    mascara: '-.--.-'
    frase: 妹は医(学)部に入りました。
    traduccion: Mi hermana entró en la facultad de medicina.
  - palabra: 博学
    lectura: はくがく
    tipo_lectura: 'on'
    significado: Erudición
    mascara: '--.--'
    frase: 先生は博(学)で知られています。
    traduccion: El profesor es conocido por su erudición.
  - palabra: 大学
    lectura: だいがく
    tipo_lectura: 'on'
    significado: Universidad
    mascara: '--.--'
    frase: 大(学)で歴史を勉強します。
    traduccion: Estudio historia en la universidad.
  - palabra: 学問
    lectura: がくもん
    tipo_lectura: 'on'
    significado: Estudio, erudición
    mascara: '--.--'
    frase: 彼は(学)問に励んでいます。
    traduccion: Él se dedica con ahínco al estudio.
  - palabra: 学校
    lectura: がっこう
    tipo_lectura: 'on'
    significado: Escuela, colegio
    mascara: '----.'
    frase: (学)校は八時に始まります。
    traduccion: La escuela empieza a las ocho.
  - palabra: 学習
    lectura: がくしゅう
    tipo_lectura: 'on'
    significado: Estudio, aprendizaje
    mascara: '--.---'
    frase: 毎朝、机で(学)習します。
    traduccion: Cada mañana estudio en mi escritorio.
  - palabra: 学術
    lectura: がくじゅつ
    tipo_lectura: 'on'
    significado: Académico, erudito
    mascara: '--.---'
    frase: (学)術の場で研究を発表しました。
    traduccion: Presenté mi investigación en un foro académico.
  - palabra: 学費
    lectura: がくひ
    tipo_lectura: 'on'
    significado: Matrícula, gastos de estudios
    mascara: '--.-'
    frase: 大学の(学)費は高いです。
    traduccion: La matrícula de la universidad es cara.
  - palabra: 建築学
    lectura: けんちくがく
    tipo_lectura: 'on'
    significado: Arquitectura (disciplina)
    mascara: '--.--.--'
    frase: 大学で建築(学)を学びました。
    traduccion: Estudió arquitectura en la universidad.
  - palabra: 数学
    lectura: すうがく
    tipo_lectura: 'on'
    significado: Matemáticas
    mascara: '--.--'
    frase: 数(学)の問題をたくさん解きました。
    traduccion: Resolví muchos problemas de matemáticas.
  - palabra: 文学
    lectura: ぶんがく
    tipo_lectura: 'on'
    significado: Literatura
    mascara: '--.--'
    frase: 彼は文(学)に大きな興味があります。
    traduccion: Él tiene mucho interés por la literatura.
  - palabra: 美学
    lectura: びがく
    tipo_lectura: 'on'
    significado: Estética
    mascara: '-.--'
    frase: 先生は美(学)を研究しています。
    traduccion: El profesor investiga sobre estética.
  - palabra: 薬学
    lectura: やくがく
    tipo_lectura: 'on'
    significado: Farmacia, ciencia farmacéutica
    mascara: '--.--'
    frase: 大学で薬(学)を学んでいます。
    traduccion: Estudio farmacia en la universidad.
  - palabra: 高等学校
    lectura: こうとうがっこう
    tipo_lectura: 'on'
    significado: Instituto de secundaria
    mascara: '--------...'
    frase: 高等(学)校に通っています。
    traduccion: Voy al instituto.
  - palabra: 免疫学
    lectura: めんえきがく
    tipo_lectura: 'on'
    significado: Inmunología
    mascara: '--.--.--'
    frase: 大学で免疫(学)を研究しています。
    traduccion: Investigo inmunología en la universidad.
  - palabra: 学習塾
    lectura: がくしゅうじゅく
    tipo_lectura: 'on'
    significado: Academia de refuerzo
    mascara: '--.---.---'
    frase: (学)習塾は駅の近くにあります。
    traduccion: La academia está cerca de la estación.
  - palabra: 疫学
    lectura: えきがく
    tipo_lectura: 'on'
    significado: Epidemiología
    mascara: '--.--'
    frase: 疫(学)の資料を集めます。
    traduccion: Recogemos datos epidemiológicos.
