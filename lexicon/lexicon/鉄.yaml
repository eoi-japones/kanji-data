id: 鉄
palabras:
  - palabra: 地下鉄
    lectura: ちかてつ
    tipo_lectura: 'on'
    significado: Metro
    mascara: '-.-.--'
    frase: 市内は地下(鉄)で行けます。
    traduccion: Por la ciudad se va en metro.
  - palabra: 鉄
    lectura: てつ
    tipo_lectura: 'on'
    significado: Hierro
    mascara: '--'
    frase: この橋は(鉄)でできています。
    traduccion: Este puente está hecho de hierro.
  - palabra: 鉄橋
    lectura: てっきょう
    tipo_lectura: 'on'
    significado: Puente de hierro
    mascara: '-----.'
    frase: 電車は(鉄)橋を渡ります。
    traduccion: El tren cruza un puente de hierro.
  - palabra: 鉄筋
    lectura: てっきん
    tipo_lectura: 'on'
    significado: Barra de hierro para hormigón, armadura
    mascara: '----.'
    frase: 建物に(鉄)筋を使います。
    traduccion: En los edificios se usa la ferralla.
  - palabra: 鉄道
    lectura: てつどう
    tipo_lectura: 'on'
    significado: Ferrocarril
    mascara: '--.--'
    frase: 父は(鉄)道会社で働いています。
    traduccion: Mi padre trabaja en una compañía de ferrocarriles.
  - palabra: 鉄塔
    lectura: てっとう
    tipo_lectura: kun
    significado: Torre de acero, torre eléctrica
    mascara: '----.'
    frase: 山の上に高い(鉄)塔が見えます。
    traduccion: En lo alto de la montaña se ve una torre de acero alta.
