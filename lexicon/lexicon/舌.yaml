id: 舌
palabras:
  - palabra: 舌
    lectura: した
    tipo_lectura: kun
    significado: Lengua
    mascara: '--'
    frase: 冷たいものを食べると(舌)が痛みました。
    traduccion: Cuando comí algo frío me dolió la lengua.
  - palabra: 舌打ち
    lectura: したうち
    tipo_lectura: kun
    significado: Chasquido de lengua
    mascara: '--.-.-'
    frase: 試合に負けて(舌)打ちをしました。
    traduccion: Tras perder el partido se chasqueó la lengua.
