id: 贈
palabras:
  - palabra: 贈り主
    lectura: おくりぬし
    tipo_lectura: kun
    significado: Remitente, dador
    mascara: '--.-.--'
    frase: (贈)り主の名前が書いてあります。
    traduccion: Está escrito el nombre del remitente.
  - palabra: 贈る
    lectura: おくる
    tipo_lectura: kun
    significado: Regalar, enviar
    mascara: '--.-'
    frase: 誕生日に花を(贈)りました。
    traduccion: Envié flores de regalo de cumpleaños.
  - palabra: 贈答
    lectura: ぞうとう
    tipo_lectura: 'on'
    significado: Intercambio de regalos
    mascara: '--.--'
    frase: (贈)答の習慣があります。
    traduccion: Existe la costumbre de intercambiar regalos.
