id: 赤
palabras:
  - palabra: 赤い
    lectura: あかい
    tipo_lectura: kun
    significado: Rojo
    mascara: '--.-'
    frase: (赤)い車が好きです。
    traduccion: Me gustan los coches rojos.
  - palabra: 赤ちゃん
    lectura: あかちゃん
    tipo_lectura: kun
    significado: Bebé
    mascara: '--.-.-.-'
    frase: 隣の部屋で(赤)ちゃんが泣いています。
    traduccion: En la habitación de al lado llora un bebé.
  - palabra: 赤字
    lectura: あかじ
    tipo_lectura: kun
    significado: Números rojos, déficit
    mascara: '--.-'
    frase: 会社は今年(赤)字になりました。
    traduccion: La empresa ha cerrado el año en números rojos.
  - palabra: 赤痢
    lectura: せきり
    tipo_lectura: 'on'
    significado: Disentería
    mascara: '--.-'
    frase: (赤)痢にかかりました。
    traduccion: Contrajo disentería.
  - palabra: アメーバ赤痢
    lectura: アメーバせきり
    tipo_lectura: 'on'
    significado: Disentería amebiana
    mascara: '-------.....'
    frase: アメーバ(赤)痢は水からうつります。
    traduccion: La disentería amebiana se contagia por el agua.
