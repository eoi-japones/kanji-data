id: 五
palabras:
  - palabra: 五つ
    lectura: いつつ
    tipo_lectura: kun
    significado: Cinco; cinco años
    mascara: '--.-'
    frase: このカバンには(五)つポケットがあります。
    traduccion: Este bolso tiene cinco bolsillos.
  - palabra: 五分
    lectura: ごぶ
    tipo_lectura: 'on'
    significado: Mitad, cincuenta por ciento
    mascara: '-.-'
    frase: 今のところ、勝負は(五)分五分です。
    traduccion: De momento, el partido está completamente igualado.
  - palabra: 五感
    lectura: ごかん
    tipo_lectura: 'on'
    significado: Cinco sentidos
    mascara: '-.--'
    frase: (五)感を使って料理を味わいます。
    traduccion: Pruebo el plato usando los cinco sentidos.
  - palabra: 笹五位
    lectura: ささごい
    tipo_lectura: 'on'
    significado: Garcilla striada
    mascara: '--.-.-'
    frase: 川で笹(五)位を見ました。
    traduccion: Vi una garcilla striada en el río.
