id: 名
palabras:
  - palabra: 名画
    lectura: めいが
    tipo_lectura: 'on'
    significado: Obra maestra (pintura o película)
    mascara: '--.-'
    frase: この映画は(名)画として知られています。
    traduccion: Esta película está considerada una obra maestra.
  - palabra: 名高い
    lectura: なだかい
    tipo_lectura: kun
    significado: Célebre, de renombre
    mascara: '-.--.-'
    frase: 彼は世界で(名)高い学者です。
    traduccion: Él es un erudito de renombre mundial.
  - palabra: 本名
    lectura: ほんみょう
    tipo_lectura: 'on'
    significado: Nombre real
    mascara: '--.---'
    frase: 彼の本(名)はまだ知られていません。
    traduccion: Su nombre real todavía no se conoce.
  - palabra: 病名
    lectura: びょうめい
    tipo_lectura: 'on'
    significado: Nombre de la enfermedad, diagnóstico
    mascara: '---.--'
    frase: 医者が病(名)を教えてくれました。
    traduccion: El médico me dijo el nombre de la enfermedad.
  - palabra: 筆名
    lectura: ひつめい
    tipo_lectura: 'on'
    significado: Seudónimo, nombre de pluma
    mascara: '--.--'
    frase: 小説家は筆(名)で書きます。
    traduccion: El novelista escribe con seudónimo.
  - palabra: 名答
    lectura: めいとう
    tipo_lectura: 'on'
    significado: Respuesta excelente
    mascara: '--.--'
    frase: それは(名)答です。
    traduccion: Esa es una respuesta excelente.
