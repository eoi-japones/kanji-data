id: 仏
palabras:
  - palabra: 仏像
    lectura: ぶつぞう
    tipo_lectura: 'on'
    significado: Estatua de Buda
    mascara: '--.--'
    frase: 寺で古い(仏)像を見ました。
    traduccion: Vi una antigua estatua de Buda en el templo.
  - palabra: 仏壇
    lectura: ぶつだん
    tipo_lectura: 'on'
    significado: Altar budista
    mascara: '--.--'
    frase: 家に小さな(仏)壇があります。
    traduccion: En casa hay un pequeño altar budista.
  - palabra: 仏教
    lectura: ぶっきょう
    tipo_lectura: 'on'
    significado: Budismo
    mascara: '-----.'
    frase: (仏)教はインドで始まりました。
    traduccion: El budismo empezó en la India.
  - palabra: 大仏
    lectura: だいぶつ
    tipo_lectura: 'on'
    significado: Gran Buda
    mascara: '--.--'
    frase: 奈良には有名な大(仏)があります。
    traduccion: En Nara hay un famoso Gran Buda.
