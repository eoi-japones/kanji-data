id: 療
palabras:
  - palabra: 医療
    lectura: いりょう
    tipo_lectura: 'on'
    significado: Asistencia médica, tratamiento médico
    mascara: '-.---'
    frase: この村は医(療)が進んでいます。
    traduccion: La asistencia médica de este pueblo está muy avanzada.
  - palabra: 救急医療
    lectura: きゅうきゅういりょう
    tipo_lectura: 'on'
    significado: Medicina de urgencias
    mascara: '---.---.-.---'
    frase: 救急医(療)の仕事をしています。
    traduccion: Trabajo en medicina de urgencias.
  - palabra: 再生医療
    lectura: さいせいいりょう
    tipo_lectura: 'on'
    significado: Medicina regenerativa
    mascara: '--.--.-.---'
    frase: 再生医(療)の研究が進んでいます。
    traduccion: Avanza la investigación en medicina regenerativa.
  - palabra: 加療
    lectura: かりょう
    tipo_lectura: 'on'
    significado: Tratamiento médico
    mascara: '-.---'
