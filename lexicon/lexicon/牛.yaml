id: 牛
palabras:
  - palabra: 子牛
    lectura: こうし
    tipo_lectura: kun
    significado: Ternero
    mascara: '-.--'
    frase: 子(牛)が牧場で遊んでいます。
    traduccion: Un ternero está jugando en la granja.
  - palabra: 水牛
    lectura: すいぎゅう
    tipo_lectura: 'on'
    significado: Búfalo de agua
    mascara: '--.---'
    frase: 水(牛)が田んぼで働いています。
    traduccion: El búfalo de agua trabaja en el arrozal.
  - palabra: 牛
    lectura: うし
    tipo_lectura: kun
    significado: Vaca, buey
    mascara: '--'
    frase: 牧場で(牛)を見ました。
    traduccion: Ví vacas en la granja.
  - palabra: 牛疫
    lectura: ぎゅうえき
    tipo_lectura: 'on'
    significado: Peste bovina
    mascara: '---.--'
    frase: (牛)疫で牛が死にました。
    traduccion: Las vacas murieron de peste bovina.
  - palabra: 牛痘
    lectura: ぎゅうとう
    tipo_lectura: 'on'
    significado: Vacuna, viruela bovina
    mascara: '---.--'
    frase: (牛)痘で病気を防ぎます。
    traduccion: La vacuna bovina previene la enfermedad.
  - palabra: 笹牛の舌
    lectura: ささうしのした
    tipo_lectura: kun
    significado: Lenguado de bambú
    mascara: '--.--.-.--'
    frase: 笹(牛)の舌という魚です。
    traduccion: Es un pez llamado lenguado de bambú.
