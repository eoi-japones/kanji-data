id: 己
palabras:
  - palabra: 利己
    lectura: りこ
    tipo_lectura: 'on'
    significado: Egoísmo, interés propio
    mascara: '-.-'
    frase: 利(己)な考えはやめましょう。
    traduccion: Dejemos de lado el pensamiento egoísta.
  - palabra: 自己
    lectura: じこ
    tipo_lectura: 'on'
    significado: Uno mismo, sí mismo
    mascara: '-.-'
    frase: 会議の最初に自(己)紹介をしました。
    traduccion: Al principio de la reunión me presenté.
  - palabra: 自己管理
    lectura: じこかんり
    tipo_lectura: 'on'
    significado: Autocontrol, cuidado de uno mismo
    mascara: '-.-.--.-'
    frase: 健康のため自(己)管理をします。
    traduccion: Me cuido por mi salud.
  - palabra: 自己免疫
    lectura: じこめんえき
    tipo_lectura: 'on'
    significado: Autoinmunidad
    mascara: '-.-.--.--'
    frase: 自(己)免疫の病気になりました。
    traduccion: Enfermó de una dolencia autoinmune.
