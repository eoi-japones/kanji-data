  - 笑
  - 笠
  - 符
  - 笹
  - 筆
  - 等
  - 筋
  - 筒
  - 答
  - 策
  - 管
  - 箱
  - 築
  - 簡
auxiliares:
  - id: 付
    para: 符
  - id: 如
    para: 筒
  - id: 官
    para: 管
  - id: エ
    para: 築
  - id: 凡
    para: 築

