id: personas_5
nombre: "Personas V: La boda y la memoria"
descripcion: >
  El mismo ciclo, mirado desde el otro extremo: la muchacha (嬢) se mira en el
  espejo y descubre su figura (姿), la gracia (嬌) y la belleza (媛) que otros
  admiran. Años después, la novia (嫁) y el novio (婿) se eligen y su vínculo
  se reconoce (嫡). Mucho más tarde, la abuela (婆) guarda la memoria de todo
  lo vivido.
integrantes:
  - 婆
  - 婿
  - 媛
  - 嫁
  - 嫡
  - 嬌
  - 嬢
  - 姿
auxiliares:
  - id: 波
    para: 婆
  - id: 疋
    para: 婿
  - id: 爰
    para: 媛
