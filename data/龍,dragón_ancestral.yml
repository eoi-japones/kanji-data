id: 龍
clave: dragón_ancestral
historia: >-
  El *dragón* *ancestral* descansa dentro de un jarrón (立). En las noches de
  luna (月) llena sale de él y asciende por el cielo nocturno con el cuerpo en
  forma de honda. Si alcanzas a verlo, te concederá tres (三) deseos.
componentes:
  - jarrón
  - luna
  - honda
  - tres
como_componente: []
solo_componente: 0
